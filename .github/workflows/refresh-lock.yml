name: Refresh dependency lock

# Keeps the hash-pinned requirements.lock current so the weekly security audit
# stays green. Dependabot's version updates watch the loose requirements.txt, and
# it cannot update this custom-named, hash-pinned lock directly, so this job
# recompiles the lock (picking up upstream and transitive security fixes) and
# opens a PR when it changes. Runs before the Monday security scan.
#
# Resolves on the lowest supported Python (3.10) so the locked versions still work
# across the whole 3.10-3.12 support range.

on:
  schedule:
    - cron: "0 4 * * 1"   # Mondays 04:00 UTC, ahead of the 06:00 security scan
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-lock
  cancel-in-progress: true

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Recompile the hash-pinned lock
        run: |
          # typing_extensions is needed by pip-tools on Python < 3.11.
          python -m pip install --upgrade pip pip-tools typing_extensions
          pip-compile --generate-hashes --upgrade \
            --output-file requirements.lock requirements.txt

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- requirements.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "requirements.lock already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit the refreshed lock
        if: steps.diff.outputs.changed == 'true'
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock --no-deps

      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/refresh-lock
          git add requirements.lock
          git commit -m "Refresh requirements.lock (dependency updates)"
          git push -f -u origin chore/refresh-lock
          if [ -z "$(gh pr list --head chore/refresh-lock --state open --json number -q '.[].number')" ]; then
            gh pr create --base main --head chore/refresh-lock \
              --title "Refresh requirements.lock (dependency updates)" \
              --body "Automated weekly recompile of the hash-pinned lockfile via \`pip-compile --upgrade\`, resolved on Python 3.10 so it stays compatible across 3.10-3.12. Picks up upstream and transitive security/version updates; \`pip-audit\` passed inline in the refresh job. Review the diff (it may include major version bumps) before merging."
          fi
