[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "outbreak"
version = "0.1.0"
description = "Realistic, age-structured stochastic SEIR epidemic simulator with an interactive UI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Outbreak contributors" }]
keywords = ["epidemiology", "SEIR", "simulation", "compartmental-model", "agent"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30", "plotly>=5.18", "pandas>=2.0"]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["outbreak"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
