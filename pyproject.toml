[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "outbreak"
version = "0.1.0"
description = "Realistic, age-structured stochastic SEIR epidemic simulator with an interactive UI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Outbreak contributors" }]
keywords = ["epidemiology", "SEIR", "simulation", "compartmental-model", "agent"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30", "plotly>=5.18", "pandas>=2.3.3"]
dev = ["pytest>=7.0", "bandit>=1.7", "pip-audit>=2.9.0"]

# Installs an `outbreak` command on the PATH (pip install -e .) that calls
# outbreak.cli:main. `python -m outbreak` works without installing, via __main__.
[project.scripts]
outbreak = "outbreak.cli:main"

[tool.setuptools]
packages = ["outbreak"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
